<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our brochure | Next Step Guyana</title>
<meta name="description" content="The Next Step Guyana brochure from the EducationUSA Guyana College Fair: CSEC and CAPE subject choices, getting into UG, other routes, and studying abroad.">
<meta property="og:site_name" content="Next Step Guyana">
<meta property="og:type" content="website">
<meta property="og:title" content="Our brochure | Next Step Guyana">
<meta property="og:description" content="Missed our brochure at the college fair? Read it here: subject choices, getting into UG, other routes and studying abroad.">
<meta property="og:url" content="https://www.nextstepgy.org/brochure">
<meta property="og:image" content="https://www.nextstepgy.org/assets/hero.jpg">
<meta property="og:image:width" content="1672">
<meta property="og:image:height" content="941">
<meta property="og:image:alt" content="Students looking up at a starry night sky">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-head bro-head">
    <div class="wrap">
      <span class="eyebrow">EducationUSA College Fair · 30 Oct 2026</span>
      <h1>Our brochure</h1>
      <p>Didn't get a copy at the fair? Here's the whole brochure: choosing subjects, getting into UG, other routes, and studying abroad.</p>
      <div class="actions">
        <a class="btn btn-gold" href="brochure/next-step-guyana-brochure.pdf" download>Download PDF (1.7 MB)</a>
        <a class="btn btn-ghost" href="navi.html">Try Navi</a>
      </div>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <p class="bro-note" id="bro-note">Tap any page to see it bigger.</p>
      <div class="bro-grid" id="bro-grid"></div>
      <div class="bro-after">
        <a class="btn btn-gold" href="mentors.html">Ask a mentor</a>
        <a class="btn btn-line" href="brochure/next-step-guyana-brochure.pdf" download>Download PDF</a>
      </div>
    </div>
  </section>
</main>

<dialog class="bro-view" id="bro-view" aria-label="Brochure page viewer">
  <div class="bv-top"><span id="bv-label"></span><button class="bv-close" type="button" aria-label="Close">×</button></div>
  <div class="bv-stage"><img id="bv-img" alt=""></div>
  <button class="bv-nav bv-prev" type="button" aria-label="Previous page">‹</button>
  <button class="bv-nav bv-next" type="button" aria-label="Next page">›</button>
</dialog>

<div id="site-footer"></div>

<script src="js/site.js"></script>
<script>
(function () {
  /* The six brochure panels, in reading order. Images live in /brochure. */
  var PAGES = [
    { name: "Cover", alt: "Cover: Next Step Guyana, CSEC and CAPE. Free, student-led and online: mentor videos, ask anything, and Q&A events. Choose. Dream. Act." },
    { name: "What we offer", alt: "What we offer: mentor-led sessions, Guyanese mentors, help with subjects, universities and scholarships, and leadership and career support. QR code to nextstepgy.org." },
    { name: "Results and choosing subjects", alt: "Results not what you hoped: CXC script reviews, rewriting as a private candidate, UG's Qualifying Exam or IDCE foundation, GOAL's GROW programme. Choosing subjects: always take English A and Maths, take two sciences for health, engineering or tech. Try Navi." },
    { name: "Getting into UG", alt: "At the University of Guyana, what do I need to get in: requirements for Medicine, Law, Engineering, Computer Science, Biology and health sciences, and Business, plus two routes into medicine." },
    { name: "Other routes and CAPE", alt: "Beyond UG: teaching at CPCE, nursing, agriculture at GSA and technical training. Should I do CAPE: reasons to do it, reasons you might skip it, and the CAPE associate degree." },
    { name: "Studying abroad", alt: "Studying abroad: UWI in the Caribbean, Canada and the United States, with how to apply, visas and costs. Ask a mentor who studied abroad at nextstepgy.org." }
  ];
  var big = function (i) { return "brochure/panel-" + (i + 1) + ".webp"; };
  var small = function (i) { return "brochure/panel-" + (i + 1) + "-sm.webp"; };

  var grid = document.getElementById("bro-grid");
  grid.innerHTML = PAGES.map(function (p, i) {
    return '<figure class="bro-page"><a href="' + big(i) + '" data-i="' + i + '" target="_blank" rel="noopener" aria-label="Open page ' + (i + 1) + ': ' + p.name + ' bigger">' +
      '<img src="' + small(i) + '" srcset="' + small(i) + " 560w, " + big(i) + ' 1100w" sizes="(min-width:1000px) 340px, (min-width:640px) 46vw, 92vw"' +
      ' width="1100" height="2550" alt="' + p.alt.replace(/"/g, "&quot;") + '"' + (i > 1 ? ' loading="lazy"' : "") + ' decoding="async"></a>' +
      "<figcaption><b>" + (i + 1) + "</b> of " + PAGES.length + " · " + p.name + "</figcaption></figure>";
  }).join("");

  /* Big screens: open pages in a viewer with arrows. Phones: open the full-size image so it can be pinch-zoomed. */
  var view = document.getElementById("bro-view"), img = document.getElementById("bv-img"), label = document.getElementById("bv-label");
  var prev = view.querySelector(".bv-prev"), next = view.querySelector(".bv-next"), cur = 0;
  var useViewer = function () { return window.matchMedia("(min-width:640px)").matches && typeof view.showModal === "function"; };
  if (!useViewer()) document.getElementById("bro-note").textContent = "Tap a page to open it full size, then pinch to zoom.";

  function show(i) {
    cur = Math.max(0, Math.min(PAGES.length - 1, i));
    img.src = big(cur); img.alt = PAGES[cur].alt;
    label.textContent = "Page " + (cur + 1) + " of " + PAGES.length + " · " + PAGES[cur].name;
    prev.disabled = cur === 0; next.disabled = cur === PAGES.length - 1;
  }
  grid.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-i]");
    if (!a || !useViewer()) return;
    e.preventDefault(); show(+a.getAttribute("data-i")); view.showModal();
  });
  prev.addEventListener("click", function () { show(cur - 1); });
  next.addEventListener("click", function () { show(cur + 1); });
  view.querySelector(".bv-close").addEventListener("click", function () { view.close(); });
  view.addEventListener("click", function (e) { if (e.target === view || e.target.classList.contains("bv-stage")) view.close(); });
  view.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") show(cur - 1);
    else if (e.key === "ArrowRight") show(cur + 1);
  });
  /* Swipe left/right in the viewer (tablets) */
  var x0 = null;
  view.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  view.addEventListener("touchend", function (e) {
    if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });
})();
</script>
</body>
</html>
