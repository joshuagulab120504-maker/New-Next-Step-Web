<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071529">
<title>Our brochure | Next Step Guyana</title>
<meta name="description" content="Flip through the Next Step Guyana brochure from the EducationUSA Guyana College Fair: CSEC and CAPE subject choices, getting into UG, other routes, and studying abroad.">
<meta property="og:site_name" content="Next Step Guyana">
<meta property="og:type" content="website">
<meta property="og:title" content="Our brochure | Next Step Guyana">
<meta property="og:description" content="Missed our brochure at the college fair? Flip through it here: subject choices, getting into UG, other routes and studying abroad.">
<meta property="og:url" content="https://www.nextstepgy.org/brochure">
<meta property="og:image" content="https://www.nextstepgy.org/brochure/panel-1.webp">
<meta property="og:image:alt" content="Cover of the Next Step Guyana brochure">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="brochure/panel-1-sm.webp" media="(max-width:819px)">
<style>
  :root{--deep:#071529;--night:#0c2340;--gold:#f2c230;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--bar:64px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--deep);color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  body{background:radial-gradient(ellipse at 50% 40%,#132e55 0%,var(--deep) 70%)}
  button,a.ctl{font:inherit;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;-webkit-tap-highlight-color:transparent}
  button:hover,a.ctl:hover{background:rgba(255,255,255,.2)}
  button:focus-visible,a.ctl:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  button[disabled]{opacity:.3;cursor:default}
  svg{display:block}

  /* Top: close + download, floating */
  .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));pointer-events:none}
  .top > *{pointer-events:auto}
  .ctl-round{width:44px;height:44px;padding:0;background:rgba(7,21,41,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .ctl-pill{height:44px;padding:0 16px;font-weight:700;font-size:15px;background:rgba(7,21,41,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  /* Bottom: prev / page label / next */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(transparent,rgba(7,21,41,.9) 40%)}
  .zoomed .bar,.swipe-mode .bar{background:rgba(7,21,41,.96);border-top:1px solid rgba(255,255,255,.08)}
  .bar .nav{width:46px;height:46px;padding:0}
  .label{min-width:11em;text-align:center;font-size:14.5px;line-height:1.25;color:#dbe3ee}
  .label b{color:#fff;display:block;font-size:15.5px}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:5px}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .2s,transform .2s}
  .dots i.on{background:var(--gold);transform:scale(1.25)}

  /* ===== Tri-fold mode (computers, landscape tablets) ===== */
  .stage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:68px 20px calc(var(--bar) + 10px);perspective:2600px}
  .book-mode .stage{display:flex}
  .zoomed .stage{align-items:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .zoomed .tri{margin-bottom:20px}
  .top .right{display:flex;gap:10px}
  #zoom{display:none}
  .book-mode #zoom{display:inline-flex}
  #zoom[aria-pressed="true"]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
  /* The folded sheet: three columns [left | middle | right] of the open inside.
     base  = middle panel (inside middle / back cover)
     flap  = folds in from the right (inside flap / inside right)
     cover = folds in from the left (front cover / inside left) */
  .tri{position:relative;flex:none;transform-style:preserve-3d;cursor:pointer;transition:transform .8s cubic-bezier(.35,.05,.2,1)}
  .part{position:absolute;top:0;width:33.3334%;height:100%;transform-style:preserve-3d;transform-origin:right center;transition:transform .8s cubic-bezier(.35,.05,.2,1)}
  .part.base,.part.flap{left:33.3333%}
  .part.cover{left:0}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.42)}
  .face.back{transform:rotateY(180deg)}
  .face img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
  .face::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  /* Closed parts sit just above the base so they never flicker into it */
  .s0 .cover,.s3 .cover{transform:translateZ(2px) rotateY(180deg)}
  .s0 .flap,.s1 .flap,.s3 .flap{transform:translateZ(1px)}
  .s2 .flap{transform:rotateY(180deg)}
  .tri.s1{transform:translateX(16.6667%)}
  .tri.s3{transform:rotateY(180deg)}

  /* ===== Swipe mode (phones, portrait tablets) ===== */
  .track{position:fixed;inset:0;display:none;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .track::-webkit-scrollbar{display:none}
  .swipe-mode .track{display:flex}
  .slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:64px 12px calc(var(--bar) + 18px)}
  .slide img{display:block;width:100%;max-width:640px;height:auto;aspect-ratio:1100/2550;margin:0 auto;border-radius:8px;background:#1b3560;box-shadow:0 10px 30px rgba(0,0,0,.45)}

  @media (prefers-reduced-motion:reduce){.tri,.part{transition:none!important}.track{scroll-behavior:auto}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  noscript{display:block;padding:80px 16px}
  noscript img{display:block;width:100%;max-width:560px;margin:0 auto 16px}
</style>
</head>
<body>
<div class="top">
  <a class="ctl ctl-round" id="close" href="events.html" aria-label="Close brochure">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </a>
  <div class="right">
    <button class="ctl-pill" id="zoom" type="button" aria-pressed="false" title="Make the pages bigger (Z)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path id="zoom-plus" d="M10.5 7.5v6"/><path d="M7.5 10.5h6"/></svg><span id="zoom-txt">Zoom</span>
    </button>
    <a class="ctl ctl-pill" href="brochure/next-step-guyana-brochure.pdf" download aria-label="Download the brochure as a PDF">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>PDF
    </a>
  </div>
</div>

<main aria-label="Next Step Guyana brochure">
  <h1 class="sr">Next Step Guyana brochure</h1>
  <div class="stage" id="stage"><div class="tri s0" id="tri" role="img" aria-label="Brochure"></div></div>
  <div class="track" id="track"></div>
  <noscript>
    <img src="brochure/panel-1.webp" alt="Front cover"><img src="brochure/panel-4.webp" alt="Getting into UG"><img src="brochure/panel-3.webp" alt="Results and choosing subjects">
    <img src="brochure/panel-5.webp" alt="Other routes and CAPE"><img src="brochure/panel-6.webp" alt="Studying abroad"><img src="brochure/panel-2.webp" alt="Back cover: What we offer">
  </noscript>
</main>

<nav class="bar" aria-label="Brochure pages">
  <button class="nav" id="prev" type="button" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="label" aria-live="polite"><b id="lbl-name">Front cover</b><span id="lbl-num">Page 1 of 6</span><div class="dots" id="dots" aria-hidden="true"></div></div>
  <button class="nav" id="next" type="button" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>

<script>
(function () {
  /* The six panels in the order you read a tri-fold:
     front cover -> open it (inside left + folded-in flap) -> open the flap (full inside) -> back cover.
     f = which image file in /brochure (panel-1 = cover, 2 = back, 3 = flap, 4-6 = inside left/middle/right). */
  var P = [
    { f: 1, name: "Front cover", alt: "Front cover: Next Step Guyana, CSEC and CAPE. Free, student-led and online: mentor videos, ask anything, and Q&A events. Choose. Dream. Act." },
    { f: 4, name: "Getting into UG", alt: "Inside left, at the University of Guyana, what do I need to get in: requirements for Medicine, Law, Engineering, Computer Science, Biology and health sciences, and Business, plus two routes into medicine." },
    { f: 3, name: "Results and choosing subjects", alt: "Inside flap. Results not what you hoped: CXC script reviews, rewriting as a private candidate, UG's Qualifying Exam or IDCE foundation, GOAL's GROW programme. Choosing subjects: always take English A and Maths; take two sciences for health, engineering or tech. Try Navi." },
    { f: 5, name: "Other routes and CAPE", alt: "Inside middle. Beyond UG: teaching at CPCE, nursing, agriculture at GSA and technical training. Should I do CAPE: reasons to do it, reasons you might skip it, and the CAPE associate degree." },
    { f: 6, name: "Studying abroad", alt: "Inside right. Studying abroad: UWI in the Caribbean, Canada and the United States, with how to apply, visas and costs. Ask a mentor who studied abroad at nextstepgy.org." },
    { f: 2, name: "Back cover: What we offer", alt: "Back cover. What we offer: mentor-led sessions, Guyanese mentors, help with subjects, universities and scholarships, and leadership and career support. QR code to nextstepgy.org." }
  ];
  var N = P.length, RATIO = 1100 / 2550;
  var big = function (i) { return "brochure/panel-" + P[i].f + ".webp"; };
  var small = function (i) { return "brochure/panel-" + P[i].f + "-sm.webp"; };
  var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); };
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body, tri = $("tri"), stage = $("stage"), track = $("track");
  var prevBtn = $("prev"), nextBtn = $("next"), zoomBtn = $("zoom"), zoomed = false;

  /* Close: go back if we came from this site, otherwise to Events */
  $("close").addEventListener("click", function (e) {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); }
    } catch (err) {}
  });

  /* Position = which page is showing, 0..5 (shared by both modes) */
  var page = 0, mode = "";

  /* ---------- Tri-fold mode ----------
     Four steps, like holding the real thing:
     0 closed (front cover) -> 1 cover opened -> 2 flap opened (full inside) -> 3 turned over (back cover) */
  var STEPS = [
    { title: "Front cover", sub: "Click to open" },
    { title: "Cover opened", sub: "Getting into UG · Results and choosing subjects" },
    { title: "Fully open", sub: "Getting into UG · Other routes and CAPE · Studying abroad" },
    { title: "Back cover", sub: "What we offer" }
  ];
  var stepOf = function (p) { return [0, 1, 1, 2, 2, 3][p]; };   /* page (reading order) -> step */
  var pageOf = function (st) { return [0, 1, 3, 5][st]; };         /* step -> first page shown */
  var built = false, step = 0;
  /* Built only the first time this view is needed, so phones never download it */
  function buildTri() {
    if (built) return; built = true;
    var face = function (cls, i) { return '<div class="face ' + cls + '"><img data-src="' + big(i) + '" alt="' + esc(P[i].alt) + '" draggable="false"></div>'; };
    tri.innerHTML =
      '<div class="part base">' + face("front", 3) + face("back", 5) + "</div>" +   /* inside middle / back cover */
      '<div class="part flap">' + face("front", 2) + face("back", 4) + "</div>" +   /* inside flap / inside right */
      '<div class="part cover">' + face("front", 1) + face("back", 0) + "</div>";   /* inside left / front cover */
    /* What's on screen loads first, the rest right after, so folds never reveal a blank panel */
    var imgs = [].slice.call(tri.querySelectorAll("img[data-src]"));
    var load = function (img) { if (img.dataset.src) { img.src = img.dataset.src; img.removeAttribute("data-src"); } };
    var firstPanel = { 0: 0, 1: 1, 2: 1, 3: 5 }[stepOf(page)];
    var first = imgs.filter(function (im) { return im.dataset.src === big(firstPanel); })[0];
    var rest = function () { imgs.forEach(load); };
    if (first) { load(first); first.addEventListener("load", rest); first.addEventListener("error", rest); } else rest();
  }
  /* Small delays so the paper folds in a believable order */
  function setDelays(from, to) {
    var parts = { tri: tri, cover: tri.querySelector(".cover"), flap: tri.querySelector(".flap") };
    var d = { tri: 0, cover: 0, flap: 0 };
    if (from === 2 && to === 3) { d.cover = 0.15; d.tri = 0.55; }        /* close flap, close cover, then turn over */
    else if (from === 3 && to === 2) { d.cover = 0.55; d.flap = 0.7; }   /* turn back, then open cover and flap */
    else if (from === 3 && to < 2) { d.cover = to === 1 ? 0.55 : 0; }
    else if (from < 2 && to === 3) { d.tri = 0.45; }
    Object.keys(parts).forEach(function (k) { if (parts[k]) parts[k].style.transitionDelay = d[k] + "s"; });
  }
  function drawTri(animate) {
    var to = stepOf(page);
    if (animate) setDelays(step, to); else setDelays(-1, -1);
    tri.className = "tri s" + to; step = to;
    tri.setAttribute("aria-label", "Brochure, " + STEPS[to].title + ": " + STEPS[to].sub);
  }
  function sizeTri() {
    var cs = getComputedStyle(stage);
    var w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    /* Fit the open brochure on screen; zoomed = fill the width (panels up to 1100px wide) and scroll down */
    var pw = zoomed ? Math.min(1100, w / 3) : Math.min(h * RATIO, w / 3);
    tri.style.width = Math.floor(pw * 3) + "px"; tri.style.height = Math.floor(pw / RATIO) + "px";
  }
  /* Click the right side to unfold further, the left side to fold back */
  tri.addEventListener("click", function (e) {
    var st = stepOf(page);
    if (st === 0) return go(1);
    if (st === 3) return go(-1);
    var r = tri.getBoundingClientRect(), third = r.width / 3;
    var left = r.left + (st === 1 ? third / 2 : 0), right = left + (st === 1 ? 2 * third : 3 * third);
    go(e.clientX > (left + right) / 2 ? 1 : -1);
  });

  /* ---------- Swipe mode: one page per screen, native swipe + scroll + pinch ---------- */
  /* Each page first loads a light version (~60-110 KB) so it appears fast on slow data,
     then the page being read swaps to the sharp version. With Data Saver or a 2G/3G
     connection, the sharp version only loads if the student pinches to zoom. */
  var conn = navigator.connection || {};
  var slow = !!(conn.saveData || /2g|3g/.test(conn.effectiveType || ""));
  track.innerHTML = P.map(function (p, i) {
    return '<section class="slide" aria-label="Page ' + (i + 1) + " of " + N + ": " + esc(p.name) + '">' +
      '<img ' + (i === 0 ? 'src="' + small(i) + '" fetchpriority="high"' : 'data-src="' + small(i) + '"') + ' width="1100" height="2550" alt="' + esc(p.alt) + '" decoding="async"></section>';
  }).join("");
  var slides = track.children, scrollTimer, queued = false;
  /* Load order on slow data: the page on screen first, then the next one, then the rest */
  function loadSlide(i) {
    var img = slides[i] && slides[i].querySelector("img[data-src]");
    if (img) { img.src = img.dataset.src; img.removeAttribute("data-src"); }
    return slides[i] && slides[i].querySelector("img");
  }
  function whenLoaded(img, fn) { if (!img || img.complete) fn(); else { img.addEventListener("load", fn, { once: true }); img.addEventListener("error", fn, { once: true }); } }
  function queueSlides() {
    if (queued) return; queued = true;
    whenLoaded(loadSlide(page), function () {
      whenLoaded(loadSlide(Math.min(N - 1, page + 1)), function () {
        for (var k = 0; k < N; k++) loadSlide(k);
        sharpen(page);
      });
    });
  }
  function sharpen(i, force) {
    var img = slides[i] && slides[i].querySelector("img");
    if (!img || img.dataset.sharp || (slow && !force) || mode !== "swipe" || (!queued && !force)) return;
    if (window.innerWidth * (window.devicePixelRatio || 1) <= 600 && !force) return; /* small screens: light version is already sharp */
    img.dataset.sharp = "1";
    var go = function () { var hi = new Image(); hi.onload = function () { img.src = hi.src; }; hi.src = big(i); };
    if (img.complete) go(); else img.addEventListener("load", go, { once: true });
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", function () {
    if (window.visualViewport.scale > 1.2) sharpen(page, true);
  });
  track.addEventListener("scroll", function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      var p = Math.round(track.scrollLeft / track.clientWidth);
      if (p !== page && p >= 0 && p < N) { page = p; label(); loadSlide(page); sharpen(page); }
    }, 60);
  }, { passive: true });
  function drawSwipe(smooth) {
    track.scrollTo({ left: page * track.clientWidth, behavior: smooth ? "smooth" : "auto" });
  }

  /* ---------- Shared ---------- */
  var dots = $("dots");
  function label() {
    var count, on, atStart, atEnd;
    if (mode === "book") {
      var st = stepOf(page);
      $("lbl-name").textContent = STEPS[st].title; $("lbl-num").textContent = STEPS[st].sub;
      count = STEPS.length; on = st; atStart = st === 0; atEnd = st === STEPS.length - 1;
    } else {
      $("lbl-name").textContent = P[page].name; $("lbl-num").textContent = "Page " + (page + 1) + " of " + N;
      count = N; on = page; atStart = page === 0; atEnd = page === N - 1;
    }
    if (dots.children.length !== count) dots.innerHTML = new Array(count + 1).join("<i></i>");
    [].forEach.call(dots.children, function (d, i) { d.classList.toggle("on", i === on); });
    prevBtn.disabled = atStart; nextBtn.disabled = atEnd;
  }
  function go(dir) {
    if (mode === "book") {
      var st = Math.max(0, Math.min(STEPS.length - 1, stepOf(page) + dir));
      page = pageOf(st); drawTri(true);
    } else {
      page = Math.max(0, Math.min(N - 1, page + dir)); loadSlide(page); drawSwipe(true); sharpen(page);
    }
    label();
  }
  function setZoom(on) {
    zoomed = on; body.classList.toggle("zoomed", on);
    zoomBtn.setAttribute("aria-pressed", on ? "true" : "false");
    $("zoom-txt").textContent = on ? "Fit" : "Zoom";
    $("zoom-plus").style.display = on ? "none" : "";
    zoomBtn.title = on ? "Fit the whole brochure on screen (Z)" : "Make the pages bigger (Z)";
    sizeTri(); stage.scrollTop = 0;
  }
  zoomBtn.addEventListener("click", function () { setZoom(!zoomed); });
  prevBtn.addEventListener("click", function () { go(-1); });
  nextBtn.addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && mode === "book")) { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key === "Home") { page = 0; refresh(); }
    else if (e.key === "End") { page = N - 1; refresh(); }
    else if ((e.key === "z" || e.key === "Z" || e.key === "+" || e.key === "-") && mode === "book") setZoom(e.key === "-" ? false : e.key === "+" ? true : !zoomed);
    else if (e.key === "Escape") { if (zoomed) setZoom(false); else $("close").click(); }
  });
  /* Swipe to flip in book mode too (landscape tablets) */
  var x0 = null, y0 = null;
  stage.addEventListener("touchstart", function (e) { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
  });

  /* Tri-fold view when the screen is wide enough to show the open brochure; otherwise one panel at a time */
  function pickMode() {
    var w = window.innerWidth, h = window.innerHeight;
    return w >= 820 && w / h >= 1.15 ? "book" : "swipe";
  }
  function refresh() {
    var m = pickMode();
    if (m !== mode) {
      mode = m;
      body.classList.toggle("book-mode", m === "book");
      body.classList.toggle("swipe-mode", m === "swipe");
      if (m !== "book" && zoomed) { zoomed = false; body.classList.remove("zoomed"); }
    }
    if (mode === "book") { buildTri(); sizeTri(); drawTri(false); }
    else { drawSwipe(false); queueSlides(); }
    label();
  }
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(refresh, 120); });
  refresh();
})();
</script>
</body>
</html>
