<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q&amp;A Events | Next Step Guyana</title>
<meta name="description" content="Free Q&A events with Next Step Guyana mentors on CSEC, CAPE, scholarships, studying abroad and careers.">
<meta property="og:site_name" content="Next Step Guyana">
<meta property="og:type" content="website">
<meta property="og:title" content="Q&amp;A Events | Next Step Guyana">
<meta property="og:description" content="Free Q&amp;A events with Next Step Guyana mentors on CSEC, CAPE, scholarships, studying abroad and careers.">
<meta property="og:url" content="https://www.nextstepgy.org/events">
<meta property="og:image" content="https://www.nextstepgy.org/assets/hero.jpg">
<meta property="og:image:width" content="1672">
<meta property="og:image:height" content="941">
<meta property="og:image:alt" content="Students looking up at a starry night sky">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <h1>Q&amp;A events</h1>
      <p>Free Q&amp;A events on one theme at a time, plus fairs and opportunities we think students should know about. Anyone can join.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <h2 style="margin-bottom:22px">Upcoming</h2>
      <div id="upcoming"></div>
      <div class="past" id="past"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data/sessions.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var s = NS.sessions();
  var up = document.getElementById("upcoming");
  up.innerHTML = s.upcoming.length
    ? s.upcoming.map(function (x) { return NS.sessionHTML(x, false); }).join("")
    : '<div class="empty-state"><div><h3>No events scheduled right now</h3>' +
      "<p>We announce new events on our WhatsApp channel and Instagram first, with the topic, date and joining link.</p></div>" +
      '<a class="btn btn-navy" href="' + SITE.whatsapp + '" target="_blank" rel="noopener">Join the WhatsApp channel</a></div>';
  if (s.past.length) {
    document.getElementById("past").innerHTML = "<h2>Past events</h2>" +
      s.past.map(function (x) { return NS.sessionHTML(x, true); }).join("");
  }
})();
</script>
</body>
</html>
