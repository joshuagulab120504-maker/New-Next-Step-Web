<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentors | Next Step Guyana</title>
<meta name="description" content="Browse Next Step Guyana's mentors: top CSEC and CAPE performers, scholarship winners, university students and young professionals.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <h1>Our mentors</h1>
      <p>Every mentor has been through CSEC or CAPE and remembers what it's like not knowing what comes next. Open a profile to read their story and get in touch.</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <div class="dir-tools">
        <label class="search">
          <span class="sr">Search mentors</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search by name, school, subject or achievement" autocomplete="off">
        </label>
        <button class="filter-btn" id="filter-btn" type="button" aria-expanded="false" aria-controls="chips">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span id="filter-label">Filter</span>
        </button>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <div class="filter-panel" id="chips" role="group" aria-label="Filter by topic" hidden></div>
      <div class="mentor-grid" id="grid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data/mentors.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var all = window.MENTORS.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }), topic = "All", q = "";
  var chips = document.getElementById("chips"), grid = document.getElementById("grid");
  var shown = [];

  // Allow linking straight to a topic, e.g. mentors.html#Law%20%26%20Humanities
  var hash = decodeURIComponent(location.hash.slice(1));
  if (TOPICS.indexOf(hash) > -1) topic = hash;

  var fbtn = document.getElementById("filter-btn"), flabel = document.getElementById("filter-label");
  function setPanel(open) {
    chips.hidden = !open;
    fbtn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function setTopic(t) {
    topic = t;
    [].forEach.call(chips.children, function (c) { c.setAttribute("aria-pressed", c.textContent === (t === "All" ? "All topics" : t) ? "true" : "false"); });
    flabel.textContent = t === "All" ? "Filter" : t;
    fbtn.classList.toggle("active", t !== "All");
    history.replaceState(null, "", t === "All" ? location.pathname : "#" + encodeURIComponent(t));
    draw();
  }
  ["All topics"].concat(TOPICS).forEach(function (label) {
    var t = label === "All topics" ? "All" : label;
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", t === topic ? "true" : "false");
    b.addEventListener("click", function () { setTopic(t); setPanel(false); fbtn.focus(); });
    chips.appendChild(b);
  });
  fbtn.addEventListener("click", function () { setPanel(chips.hidden); });
  document.addEventListener("click", function (e) {
    if (!chips.hidden && !chips.contains(e.target) && !fbtn.contains(e.target)) setPanel(false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !chips.hidden) { setPanel(false); fbtn.focus(); } });
  if (topic !== "All") { flabel.textContent = topic; fbtn.classList.add("active"); }

  document.getElementById("q").addEventListener("input", function (e) { q = e.target.value.toLowerCase().trim(); draw(); });

  function draw() {
    shown = all.filter(function (m) {
      var inTopic = topic === "All" || (m.topics || []).indexOf(topic) > -1;
      var text = (m.name + " " + m.school + " " + m.field + " " + (m.topics || []).join(" ") + " " + m.highlights.join(" ")).toLowerCase();
      return inTopic && (!q || text.indexOf(q) > -1);
    });
    document.getElementById("count").textContent = shown.length + (shown.length === 1 ? " mentor" : " mentors");
    grid.innerHTML = shown.length ? shown.map(NS.card).join("")
      : '<p class="empty">No mentors match "' + NS.esc(q) + '"' + (topic !== "All" ? " in " + NS.esc(topic) : "") + '. Try a different word, or <a href="mailto:' + SITE.email + '">email us</a> and we\'ll find someone.</p>';
  }
  grid.addEventListener("click", function (e) {
    var c = e.target.closest(".mcard");
    if (c) NS.openProfile(shown[+c.getAttribute("data-i")]);
  });
  draw();
})();
</script>
</body>
</html>
