<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources | Next Step Guyana</title>
<meta name="description" content="Free videos and handbooks on CSEC, CAPE and university from Next Step Guyana's mentors.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <h1>Resources</h1>
      <p>Videos and handbooks on CSEC, CAPE and university, made by students who've been through them.</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <div class="res-block">
        <h2>Videos</h2>
        <div id="videos"></div>
        <div class="vmore" id="vmore" hidden><button class="btn btn-line" type="button" id="vmore-btn" aria-controls="videos" aria-expanded="false"></button></div>
      </div>

      <div class="res-block">
        <h2>Handbooks</h2>
        <div id="handbooks"></div>
      </div>

      <div class="res-block">
        <h2>Helpful links</h2>
        <p class="res-intro">Official sites and tools our mentors used for exams, scholarships and applications.</p>
        <div class="res-cats" id="links"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data/resources.js"></script>
<script src="data/mentors.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var SHOW = 5; /* how many videos show before "See all videos" */
  var B = window.HANDBOOKS || [], L = window.LINKS || [], M = window.MENTORS || [];
  var host = function (u) { try { return new URL(u, location.href).host.replace(/^www\./, ""); } catch (e) { return ""; } };
  /* Accepts a full YouTube link (youtu.be/…, watch?v=…, shorts/…) or just the ID */
  var ytId = function (v) {
    var m = String(v || "").match(/(?:youtu\.be\/|[?&]v=|\/(?:embed|shorts|live)\/)([\w-]{11})/);
    return m ? m[1] : String(v || "").trim();
  };
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  /* "2026-10-29" -> "29 Oct 2026" */
  var niceDate = function (d) {
    var m = String(d || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    return m && MONTHS[+m[2] - 1] ? +m[3] + " " + MONTHS[+m[2] - 1] + " " + m[1] : "";
  };
  var cleanTitle = function (t) { return String(t || "").replace(/^\s*next\s*step\s*guyana\s*[-–—|:]\s*/i, ""); };
  var mentorOf = function (name) {
    var n = String(name || "").trim().toLowerCase();
    return n ? M.filter(function (m) { return m.name.toLowerCase() === n; })[0] : null;
  };
  /* Newest first by date; videos without a date keep their order at the end */
  var V = (window.VIDEOS || []).map(function (v, i) { return { v: v, i: i }; })
    .sort(function (a, b) {
      var da = a.v.date || "", db = b.v.date || "";
      if (da !== db) return da && db ? (da < db ? 1 : -1) : (da ? -1 : 1);
      return a.i - b.i;
    }).map(function (x) { return x.v; });

  function empty(title, text) {
    return '<div class="empty-state"><div><h3>' + title + "</h3><p>" + text + "</p></div>" +
      '<a class="btn btn-navy" href="' + SITE.whatsapp + '" target="_blank" rel="noopener">Get notified on WhatsApp</a></div>';
  }

  /* Posted in the last 14 days? */
  var NEW_DAYS = 14;
  var isNew = function (d) {
    var m = String(d || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (!m) return false;
    var age = (Date.now() - new Date(+m[1], +m[2] - 1, +m[3]).getTime()) / 864e5;
    return age >= -1 && age < NEW_DAYS;
  };
  var pageUrl = location.origin + location.pathname;
  var WA_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
  var PLAY_ICON = '<svg viewBox="0 0 68 48" width="68" height="48" aria-hidden="true"><path d="M66.5 7.7a8.6 8.6 0 0 0-6-6C55.2.3 34 .3 34 .3S12.8.3 7.5 1.7a8.6 8.6 0 0 0-6 6C0 13 0 24 0 24s0 11 1.5 16.3a8.6 8.6 0 0 0 6 6C12.8 47.7 34 47.7 34 47.7s21.2 0 26.5-1.4a8.6 8.6 0 0 0 6-6C68 35 68 24 68 24s0-11-1.5-16.3z" fill="#f2c230"/><path d="M27 34V14l18 10z" fill="#0b1f3a"/></svg>';

  function videoCard(v) {
    var id = ytId(v.youtube), m = mentorOf(v.mentor), first = m ? m.name.split(" ")[0] : "",
        title = cleanTitle(v.title), when = niceDate(v.date),
        share = "https://wa.me/?text=" + encodeURIComponent(title + " — free video from Next Step Guyana\n" + pageUrl + "#v-" + id);
    return '<article class="video" id="v-' + NS.esc(id) + '">' +
      /* Thumbnail first; the YouTube player only loads when tapped (saves data) */
      '<div class="frame"><button class="vplay" type="button" data-id="' + NS.esc(id) + '" data-title="' + NS.esc(title) + '" aria-label="Play video: ' + NS.esc(title) + '">' +
        '<img src="https://i.ytimg.com/vi/' + encodeURIComponent(id) + '/hqdefault.jpg" alt="" loading="lazy">' +
        '<span class="vplay-icon">' + PLAY_ICON + "</span>" +
        (isNew(v.date) ? '<span class="vnew">New</span>' : "") +
        (v.length ? '<span class="vlen">' + NS.esc(v.length) + "</span>" : "") +
      "</button></div>" +
      '<div class="vt"><h3>' + NS.esc(title) + "</h3>" +
      (when ? '<time class="vdate" datetime="' + NS.esc(v.date) + '">Posted ' + when + "</time>" : "") +
      (v.description ? "<p>" + NS.esc(v.description) + "</p>" : "") +
      '<div class="vactions">' +
        (m ? '<button class="vmentor" type="button" data-mentor="' + NS.esc(m.name) + '" aria-haspopup="dialog">' +
             '<span class="vava">' + NS.photo(m, "") + "</span><span>See " + NS.esc(first) + "'s mentor profile</span></button>" : "") +
        '<a class="vshare" href="' + share + '" target="_blank" rel="noopener" aria-label="Share ' + NS.esc(title) + ' on WhatsApp">' + WA_ICON + "<span>Share</span></a>" +
      "</div></div></article>";
  }

  var box = document.getElementById("videos"), more = document.getElementById("vmore"), moreBtn = document.getElementById("vmore-btn");
  var all = false;
  function drawVideos() {
    if (!V.length) {
      box.innerHTML = empty("Videos are on the way", "We're recording Q&amp;A events and short guides with our mentors. They'll appear here as soon as they're ready.");
      more.hidden = true; return;
    }
    var list = all ? V : V.slice(0, SHOW);
    box.innerHTML = '<div class="videos">' + list.map(videoCard).join("") + "</div>";
    more.hidden = V.length <= SHOW;
    moreBtn.textContent = all ? "Show fewer videos" : "See all " + V.length + " videos";
    moreBtn.setAttribute("aria-expanded", all ? "true" : "false");
  }
  moreBtn.addEventListener("click", function () {
    all = !all; drawVideos();
    if (all) { var next = box.querySelectorAll(".video")[SHOW]; if (next) next.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else box.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  box.addEventListener("click", function (e) {
    var b = e.target.closest(".vmentor");
    if (b) { NS.openProfile(mentorOf(b.getAttribute("data-mentor"))); return; }
    var p = e.target.closest(".vplay");
    if (p) {
      var f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(p.getAttribute("data-id")) + "?rel=0&autoplay=1&playsinline=1";
      f.title = p.getAttribute("data-title");
      f.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen";
      f.allowFullscreen = true;
      p.parentNode.replaceChild(f, p);
    }
  });
  drawVideos();

  /* Shared links (resources#v-VIDEOID) open the page at that video */
  var want = decodeURIComponent(location.hash.slice(1));
  if (/^v-[\w-]{11}$/.test(want)) {
    if (!document.getElementById(want) && V.some(function (v) { return "v-" + ytId(v.youtube) === want; })) { all = true; drawVideos(); }
    var el = document.getElementById(want);
    if (el) {
      el.classList.add("vhl");
      setTimeout(function () { el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 50);
      setTimeout(function () { el.classList.remove("vhl"); }, 3500);
    }
  }

  document.getElementById("handbooks").innerHTML = B.length
    ? '<div class="books">' + B.map(function (h) {
        return '<a class="book" href="' + NS.esc(h.file) + '" target="_blank" rel="noopener">' +
          '<span class="book-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>' +
          '<span class="book-text"><b>' + NS.esc(h.title) + "</b>" +
          (h.description ? "<span>" + NS.esc(h.description) + "</span>" : "") + '<em>Open handbook</em></span></a>';
      }).join("") + "</div>"
    : empty("Handbooks are on the way", "Our mentors are writing handbooks on CSEC, CAPE and university applications. Each one will be free to read and download here.");

  var cats = window.LINK_CATEGORIES || [];
  document.getElementById("links").innerHTML = cats.map(function (c) {
    var items = L.filter(function (r) { return r.category === c; });
    if (!items.length) return "";
    return '<div class="res-cat"><h3>' + NS.esc(c) + '</h3><div class="res-list">' +
      items.map(function (r) {
        return '<a class="res" href="' + NS.esc(r.url) + '" target="_blank" rel="noopener"><b>' + NS.esc(r.title) + "</b>" +
          (r.description ? "<span>" + NS.esc(r.description) + "</span>" : "") + "<small>" + NS.esc(host(r.url)) + "</small></a>";
      }).join("") + "</div></div>";
  }).join("");
})();
</script>
</body>
</html>
