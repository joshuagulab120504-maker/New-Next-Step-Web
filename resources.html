<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources | Next Step Guyana</title>
<meta name="description" content="Free videos and handbooks on CSEC, CAPE and university from Next Step Guyana's mentors.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <h1>Resources</h1>
      <p>Videos and handbooks on CSEC, CAPE and university, made by students who've been through them.</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <div class="chips" id="levels" role="group" aria-label="Filter by level"></div>

      <div class="res-block">
        <h2>Videos</h2>
        <div id="videos"></div>
      </div>

      <div class="res-block">
        <h2>Handbooks</h2>
        <div id="handbooks"></div>
      </div>

      <div class="res-block">
        <h2>Helpful links</h2>
        <p class="res-intro">Official sites and tools our mentors used for exams, scholarships and applications.</p>
        <div class="res-cats" id="links"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data/resources.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var V = window.VIDEOS || [], B = window.HANDBOOKS || [], L = window.LINKS || [];
  var levels = ["All"].concat(window.RESOURCE_LEVELS || []);
  var level = "All";
  var host = function (u) { try { return new URL(u, location.href).host.replace(/^www\./, ""); } catch (e) { return ""; } };
  var match = function (x) { return level === "All" || x.level === level; };

  var chips = document.getElementById("levels");
  levels.forEach(function (l) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = l;
    b.setAttribute("aria-pressed", l === level ? "true" : "false");
    b.addEventListener("click", function () {
      level = l;
      [].forEach.call(chips.children, function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
      draw();
    });
    chips.appendChild(b);
  });

  function empty(title, text) {
    return '<div class="empty-state"><div><h3>' + title + "</h3><p>" + text + "</p></div>" +
      '<a class="btn btn-navy" href="' + SITE.whatsapp + '" target="_blank" rel="noopener">Get notified on WhatsApp</a></div>';
  }
  function draw() {
    var lvl = level === "All" ? "" : " for " + level;
    var vids = V.filter(match), books = B.filter(match);

    document.getElementById("videos").innerHTML = vids.length
      ? '<div class="videos">' + vids.map(function (v) {
          return '<div class="video"><div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.youtube) +
            '" title="' + NS.esc(v.title) + '" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>' +
            '<div class="vt"><span class="lvl">' + NS.esc(v.level) + "</span><b>" + NS.esc(v.title) + "</b>" +
            (v.description ? "<p>" + NS.esc(v.description) + "</p>" : "") + "</div></div>";
        }).join("") + "</div>"
      : empty("Videos" + lvl + " are on the way", "We're recording Q&amp;A events and short guides with our mentors. They'll appear here as soon as they're ready.");

    document.getElementById("handbooks").innerHTML = books.length
      ? '<div class="books">' + books.map(function (h) {
          return '<a class="book" href="' + NS.esc(h.file) + '" target="_blank" rel="noopener">' +
            '<span class="book-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>' +
            '<span class="book-text"><span class="lvl">' + NS.esc(h.level) + "</span><b>" + NS.esc(h.title) + "</b>" +
            (h.description ? "<span>" + NS.esc(h.description) + "</span>" : "") + '<em>Open handbook</em></span></a>';
        }).join("") + "</div>"
      : empty("Handbooks" + lvl + " are on the way", "Our mentors are writing handbooks on CSEC, CAPE and university applications. Each one will be free to read and download here.");
  }

  var cats = window.LINK_CATEGORIES || [];
  document.getElementById("links").innerHTML = cats.map(function (c) {
    var items = L.filter(function (r) { return r.category === c; });
    if (!items.length) return "";
    return '<div class="res-cat"><h3>' + NS.esc(c) + '</h3><div class="res-list">' +
      items.map(function (r) {
        return '<a class="res" href="' + NS.esc(r.url) + '" target="_blank" rel="noopener"><b>' + NS.esc(r.title) + "</b>" +
          (r.description ? "<span>" + NS.esc(r.description) + "</span>" : "") + "<small>" + NS.esc(host(r.url)) + "</small></a>";
      }).join("") + "</div></div>";
  }).join("");

  draw();
})();
</script>
</body>
</html>
